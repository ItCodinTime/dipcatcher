repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to the uv.lock ruff version — pre-commit and `make lint` must not
    # drift (they used to: rev v0.8.0 vs locked 0.16.x).
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # Local hooks run through `uv run`/`uvx` so tool versions come from
      # uv.lock (mypy) or an explicit pin (bandit) — matching CI exactly.
      - id: mypy
        name: mypy (uv run)
        entry: uv run mypy src/quant_fund
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy-fx1
        name: mypy fx1 (uv run)
        entry: uv run mypy src/fx1
        language: system
        pass_filenames: false
        types: [python]
      - id: bandit
        name: bandit (uvx pinned)
        entry: uvx --from bandit==1.9.4 bandit -q -r src --severity-level medium --confidence-level medium
        language: system
        pass_filenames: false
        types: [python]
      - id: secret-scan
        name: secret-scan (staged diff)
        entry: uv run python scripts/secret_scan.py
        language: system
        pass_filenames: false
      # Lockfile must stay in sync with pyproject — a stale uv.lock broke
      # `uv sync --frozen` once already; fail the commit instead.
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
