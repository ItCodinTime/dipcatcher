name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync --all-groups
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run mypy src/quant_fund
      - name: Pytest
        run: uv run pytest -q -m "not network"
