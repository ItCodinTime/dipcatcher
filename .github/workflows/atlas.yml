name: atlas

# Freshness gate for the architecture atlas: the committed Mermaid
# diagrams and manifest under docs/architecture/ (plus the embedded blocks
# in docs/ARCHITECTURE_ATLAS.md) must match what
# scripts/gen_arch_diagrams.py produces from the current source tree.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --all-groups
      - name: Architecture diagrams fresh
        run: uv run python scripts/gen_arch_diagrams.py --check
      - name: Atlas unit tests
        run: uv run pytest tests/unit/docs -q
