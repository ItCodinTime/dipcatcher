name: fx1

on:
  push:
    branches: [main, 'fx-1/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --all-groups
      - name: Lint
        run: uv run ruff check src/fx1 tests/fx1
      - name: Types
        run: uv run mypy src/fx1
      - name: Tests
        run: uv run pytest tests/fx1 -q
      - name: Corpus contract smoke
        run: |
          uv run fx1 corpus build --receipts-dir receipts --out /tmp/corpus_smoke.jsonl
          uv run python - <<'EOF'
          import json
          lines = [json.loads(x) for x in open("/tmp/corpus_smoke.jsonl") if x.strip()]
          assert lines, "corpus build produced no examples"
          assert all(len(x["receipt_sha256"]) == 64 for x in lines), "provenance missing"
          assert all([m["role"] for m in x["messages"]] == ["system", "user", "assistant"] for x in lines)
          print(f"corpus smoke: {len(lines)} examples, provenance intact")
          EOF
