name: fx1
on:
  push:
    branches: [main, 'fx-1/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -e '.[dev]' pytest hypothesis typer pydantic ruff mypy
      - name: Lint
        run: ruff check src tests
      - name: Types
        run: mypy src/fx1
      - name: Tests
        run: python -m pytest tests/ -q
