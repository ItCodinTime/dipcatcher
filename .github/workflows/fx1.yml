name: fx1

on:
  push:
    branches: [main, 'fx-1/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --all-groups
      - name: Lint
        run: uv run ruff check src/fx1 tests/fx1
      - name: Types
        run: uv run mypy src/fx1
      - name: Tests
        run: uv run pytest tests/fx1 -q
