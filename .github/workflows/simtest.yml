name: Deterministic simulation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      seeds:
        description: Seed count for the large swarm
        required: false
        default: "4000"
      days:
        description: Session length in weekday bars
        required: false
        default: "8"
      base_seed:
        description: First seed
        required: false
        default: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simtest-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --all-groups
      - name: Simulation unit and regression tests
        run: uv run pytest tests/unit/simtest tests/regression/test_simtest_duplicate_bar_order.py -q -m "not slow"
      - name: Bounded swarm
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: uv run python scripts/simtest_swarm.py --seeds 64 --days 5 --base-seed 0

  simtest-large:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --all-groups
      - name: Large swarm
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: uv run python scripts/simtest_swarm.py --seeds ${{ inputs.seeds }} --days ${{ inputs.days }} --base-seed ${{ inputs.base_seed }}
