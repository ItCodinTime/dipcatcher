inherit: base.yaml
runtime:
  mode: research
universe:
  min_price: 5.0
  min_adv: 100000.0
  min_history_bars: 60
  top_n_adv: 50
features:
  winsor_p: 0.01
  ewma_lambda: 0.94
data:
  source: synthetic
  synthetic_n_assets: 36
  synthetic_n_days: 504
  synthetic_seed: 7
  synthetic_oracle_beta: 0.015
  synthetic_oracle_phi: 0.70
robinhood_plus:
  enabled: true
  backend: numpy
  blend_weight: 0.0
  lookback: 64
  pred_len: 5
  sample_count: 8
  s1_bits: 5
  s2_bits: 5
  allow_network: false
  clip: 5.0
  temperature: 1.0
  top_p: 0.9
  max_context: 512
  decoder: markov
train:
  ranking_target: future_idio_return_1
  ridge_alpha: 0.3
validation:
  scheme: expanding
  train_bars: 180
  val_bars: 40
  test_bars: 40
# Transparent fusion on; learned fusion remains off (ADR). Interval caps on.
fusion:
  alpha_weight: 1.0
  confidence_weight: 1.0
  regime_weight: 1.0
  risk_weight: 1.0
  tail_penalty: 1.0
  liquidity_penalty: 1.0
  min_executable_alpha: 0.0
  alpha_scale: 0.005
  use_fused_for_optimize: true
  apply_interval_caps: true
constraints:
  turnover_limit: 0.4
  max_adv_participation: 0.10
promotion:
  min_mean_ic: 0.0
  min_cost_adjusted_spread: 0.0
  max_turnover: 5.0
  require_leakage_pass: true
  min_folds: 2
  min_fold_ic_stability: 0.5
