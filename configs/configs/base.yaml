runtime:
  mode: research
  allow_live: false
universe:
  min_price: 5.0
  min_adv: 100000.0
  min_history_bars: 60
  top_n_adv: 50
calendar:
  name: XNYS
horizons:
  bars: [1, 5, 20]
  names: ["1d", "5d", "20d"]
quantiles:
  levels: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]
costs:
  commission_bps: 1.0
  half_spread_bps: 5.0
  impact_y: 0.1
  borrow_bps_per_year: 50.0
  frictionless: false
  participation_limit: 0.1
execution:
  fill: next_open
  allow_close_auction: false
  horizon_bars: 5
  n_slices: 5
# Sleeve (long_max + short_max) matches gross_leverage so the gross L1 cap is not dead.
# Name caps are per-name; sleeve caps are aggregate long / aggregate short.
constraints:
  gross_leverage: 2.0
  net_exposure: 0.05
  name_max: 0.05
  name_min: -0.05
  long_max: 1.0
  short_max: 1.0
  turnover_limit: 0.4
  sector_abs_max: 0.25
optimizer:
  lambda_risk: 8.0
  lambda_tc: 1.0
  lambda_tail: 0.0
  solver: CLARABEL
  mode: mean_variance
validation:
  scheme: expanding
  train_bars: 180
  val_bars: 40
  test_bars: 40
  n_optuna_trials: 8
  seed: 42
features:
  winsor_p: 0.01
  ewma_lambda: 0.94
data:
  root: data
  source: synthetic
  synthetic_n_assets: 12
  synthetic_n_days: 320
  synthetic_seed: 7
  benchmark_id: SEC_MKT
train:
  ranking_target: future_excess_return_5
  random_seed: 42
fusion:
  min_executable_alpha: 0.0
  use_fused_for_optimize: true
  apply_interval_caps: true
risk_gate:
  max_order_notional: 1000000.0
  max_gross: 2.0
  max_net: 0.2
  max_name: 0.05
  max_participation: 0.1
  max_predicted_vol: 0.4
kill_switch:
  state: ENABLED
  allow_auto_flatten: false
promotion:
  min_mean_ic: 0.0
  min_cost_adjusted_spread: 0.0
  max_turnover: 5.0
  require_leakage_pass: true
northset:
  n_book_levels: 5
  n_session_candles: 8
  base_spread_bps: 4.0
  min_names: 5
  sweep_lookback: 20
  sweep_horizons: [1, 5, 20]
  sweep_vol_lookback: 20
  sweep_n_boot: 500
  sweep_n_permutations: 200
  sweep_n_folds: 4
  sweep_min_events: 30
  sweep_min_dates: 20
  sweep_min_fold_positive_fraction: 0.75
  sweep_cooldown_bars: 5
  sweep_sensitivity_lookbacks: [10, 20, 40]
  require_adjusted_ohlc: true
  book_max_age_seconds: 86400
