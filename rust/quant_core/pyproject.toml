[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "quant_core"
version = "0.1.0"
description = "Optional PyO3 kernels for dipcatcher. Not a live-trading component."
requires-python = ">=3.12"
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "quant_core"
features = ["pyo3/extension-module"]
