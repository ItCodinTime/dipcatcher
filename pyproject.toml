[project]
name = "fx-1"
dynamic = ["version"]
description = "fx-1: a quant LLM fine-tuned from Kimi K3 open weights. dipcatcher is the harness - data engine, evaluation, and verification for fx-1. Not a promise of live profit."
readme = "README.md"
authors = [
    { name = "Advaith Vaithianathan", email = "140935487+cosmic-hydra@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "polars>=1.17",
    "pyarrow>=17",
    "duckdb>=1.1",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "structlog>=24.4",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "arch>=7.0",
    "cvxpy>=1.6",
    "clarabel>=0.9",
    "hmmlearn>=0.3.3",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "optuna>=4.0",
    "mlflow>=2.17",
    "matplotlib>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-dotenv>=1.0",
    "joblib>=1.4",
]

[project.optional-dependencies]
nn = ["torch>=2.4"]

[project.scripts]
fx1 = "fx1.cli:app"
# Harness aliases: dipcatcher remains the lab/harness CLI used to build,
# evaluate, and verify fx-1.
quant = "quant_fund.cli.main:app"
dipcatcher = "quant_fund.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fx1", "src/quant_fund"]

# Default sdist = every VCS-tracked file (data/, notebooks, host symlinks —
# 37k files). The distributable source is the buildable package + tests.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "configs",
    "docs",
    "scripts",
    "pyproject.toml",
    "README.md",
    "SECURITY.md",
    ".env.example",
    "Makefile",
]

# Single source of truth: fx1.__version__ follows semver per
# docs/FX1_API_STABILITY.md — the distribution must not drift from it.
[tool.hatch.version]
path = "src/fx1/__init__.py"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "UP042", "SIM108", "SIM115"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

[tool.mypy]
python_version = "3.12"
strict = false
# Ratcheted 2026-09-16: checks untyped bodies (verified 0 errors at 133 files).
# Repo-wide knobs (warn_return_any, warn_unused_ignores, no_implicit_optional,
# strict_equality) remain off until the remaining diagnostics are resolved.
# 2026-09-17: warn_return_any + warn_unused_ignores are enforced per-module via
# the overrides below (11 numeric modules verified clean); extend module by
# module as diagnostics are fixed. Do not loosen the ratcheted modules.
check_untyped_defs = true
# Global default since 2026-09-25: untyped library results may not leak from
# typed functions. The measured 66-module debt list below carries the
# exemptions — shrink it as diagnostics are fixed, never grow it.
warn_return_any = true
disallow_untyped_defs = false
packages = ["fx1", "quant_fund"]
ignore_missing_imports = true
warn_unused_ignores = false

# Public-source adapters intentionally expose explicit per-source fetch kwargs
# (series_id, cik, path, ...) instead of an untyped **kwargs signature, so the
# LSP override warning on SourceAdapter.fetch(**kwargs) is disabled here only.
[[tool.mypy.overrides]]
module = ["quant_fund.data.sources.adapters"]
disable_error_code = ["override"]

# Numeric-return ratchet: these modules must not leak untyped library results.
# (Redundant for warn_return_any since the 2026-09-25 global default below;
# kept because warn_unused_ignores is still enforced here only.)
[[tool.mypy.overrides]]
module = [
    "quant_fund.utils.numeric",
    "quant_fund.metrics.conformal",
    "quant_fund.metrics.evalues",
    "quant_fund.metrics.probability",
    "quant_fund.execution.almgren_chriss",
    "quant_fund.portfolio.interval_risk",
    "quant_fund.models.covariance",
    "quant_fund.models.regime",
    "quant_fund.models.calibration",
    "quant_fund.models.distribution",
    "quant_fund.models.tail",
]
warn_return_any = true
warn_unused_ignores = true

# 2026-09-25: warn_return_any is now the GLOBAL default (new code is strict
# by default). The 66 modules below are the measured debt list — each is
# exempted until its no-any-return diagnostics are fixed. Shrink the list;
# never grow it.
[[tool.mypy.overrides]]
module = [
    "quant_fund.hedge_lab.runner",
    "quant_fund.hedge_lab.v2_slate",
    "quant_fund.lightspeed.metalabel",
    "quant_fund.metrics.distribution",
    "quant_fund.metrics.entropic_risk",
    "quant_fund.metrics.hac",
    "quant_fund.metrics.regression",
    "quant_fund.models.american_baw",
    "quant_fund.models.archimedean_extra",
    "quant_fund.models.asset_pricing",
    "quant_fund.models.carr_madan",
    "quant_fund.models.changepoint",
    "quant_fund.models.copula",
    "quant_fund.models.dcc",
    "quant_fund.models.deep_rl",
    "quant_fund.models.dfm",
    "quant_fund.models.dynamic_panel",
    "quant_fund.models.edgeworth",
    "quant_fund.models.egarch",
    "quant_fund.models.elliptical",
    "quant_fund.models.ensemble",
    "quant_fund.models.ets",
    "quant_fund.models.filters",
    "quant_fund.models.functional",
    "quant_fund.models.gam",
    "quant_fund.models.gaussian_copula_default",
    "quant_fund.models.glasso",
    "quant_fund.models.gmm_est",
    "quant_fund.models.johnson_sb",
    "quant_fund.models.johnson_su",
    "quant_fund.models.kronos",
    "quant_fund.models.leisen_reimer",
    "quant_fund.models.mixture",
    "quant_fund.models.nig_vg",
    "quant_fund.models.nowcasting",
    "quant_fund.models.ranking",
    "quant_fund.models.realized_garch",
    "quant_fund.models.regime_switch",
    "quant_fund.models.rmt",
    "quant_fund.models.robinhood_plus.transformer",
    "quant_fund.models.robust_cov",
    "quant_fund.models.sabr",
    "quant_fund.models.skew_normal",
    "quant_fund.models.skew_t",
    "quant_fund.models.smoothers",
    "quant_fund.models.sparse",
    "quant_fund.models.spectral",
    "quant_fund.models.tempered_stable",
    "quant_fund.models.vasicek_credit",
    "quant_fund.models.volatility",
    "quant_fund.northset.benches",
    "quant_fund.northset.estimators",
    "quant_fund.pipeline.forecast",
    "quant_fund.pipeline.kronos",
    "quant_fund.portfolio.allocators",
    "quant_fund.portfolio.resampled",
    "quant_fund.quant_models.black_scholes",
    "quant_fund.quant_models.greeks",
    "quant_fund.quant_models.heston",
    "quant_fund.quant_models.svi",
    "quant_fund.registry.mlflow_store",
    "quant_fund.research.agent",
    "quant_fund.risk.pyriskmgmt",
]
warn_return_any = false

[tool.pytest.ini_options]
# Canonical discovery: the fx-1 suite runs via `make fx1-test` (tests/fx1 is
# intentionally outside testpaths; the dead tests/tests mirror was removed).
testpaths = ["tests/unit", "tests/property", "tests/regression", "tests/end_to_end"]
addopts = "-q --strict-markers"
markers = [
    "network: tests that require internet (disabled by default)",
    "slow: longer integration tests",
    "synthetic: uses synthetic market data",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["fx1", "quant_fund"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
# Single source of truth for the coverage gate (CI/Makefile pass no inline
# --cov-fail-under so the threshold cannot drift between the two).
# Ratcheted 2026-09-25: measured 84.93% local (macOS) and 81.51% on CI
# (Linux) — floor set at 80 with cross-platform headroom. Raise, never lower.
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"
