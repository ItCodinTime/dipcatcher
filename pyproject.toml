[project]
name = "dipcatcher"
version = "1.0.0"
description = "Artificial Hedge proprietary agentic probability and statistics research centre. Not a promise of live profit."
readme = "README.md"
authors = [
    { name = "Advaith Vaithianathan", email = "140935487+cosmic-hydra@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "polars>=1.17",
    "pyarrow>=17",
    "duckdb>=1.1",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "structlog>=24.4",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "arch>=7.0",
    "cvxpy>=1.6",
    "clarabel>=0.9",
    "hmmlearn>=0.3.3",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "optuna>=4.0",
    "mlflow>=2.17",
    "matplotlib>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-dotenv>=1.0",
    "joblib>=1.4",
]

[project.optional-dependencies]
nn = ["torch>=2.4"]

[project.scripts]
quant = "quant_fund.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_fund"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "UP042", "SIM108", "SIM115"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = false
packages = ["quant_fund"]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: tests that require internet (disabled by default)",
    "slow: longer integration tests",
    "synthetic: uses synthetic market data",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["quant_fund"]
branch = true
