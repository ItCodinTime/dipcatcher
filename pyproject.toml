[project]
name = "fx-1"
dynamic = ["version"]
description = "fx-1: a quant LLM fine-tuned from Kimi K3 open weights. dipcatcher is the harness - data engine, evaluation, and verification for fx-1. Not a promise of live profit."
readme = "README.md"
authors = [
    { name = "Advaith Vaithianathan", email = "140935487+cosmic-hydra@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "polars>=1.17",
    "pyarrow>=17",
    "duckdb>=1.1",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "structlog>=24.4",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "arch>=7.0",
    "cvxpy>=1.6",
    "clarabel>=0.9",
    "hmmlearn>=0.3.3",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "optuna>=4.0",
    "mlflow>=2.17",
    "matplotlib>=3.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-dotenv>=1.0",
    "joblib>=1.4",
    "numba>=0.60",
    "exchange-calendars==4.13.2",
]

[project.optional-dependencies]
nn = ["torch>=2.4"]
# CPU JAX is enough for the differentiable backtest. Not a core dependency:
# `uv sync --frozen --all-groups` (no extras) does not install it. The
# `diffbacktest` CI job installs this extra explicitly and pins JAX to CPU.
jax = ["jax>=0.4.38"]

[project.urls]
Repository = "https://github.com/artificial-hedge/dipcatcher"
Issues = "https://github.com/artificial-hedge/dipcatcher/issues"

[project.scripts]
fx1 = "fx1.cli:app"
# Harness aliases: dipcatcher remains the lab/harness CLI used to build,
# evaluate, and verify fx-1.
quant = "quant_fund.cli.main:app"
dipcatcher = "quant_fund.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-benchmark>=5.1",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
    "httpx>=0.27",
]
docs = [
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.27",
    "watchdog>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fx1", "src/quant_fund"]

# py.typed is the PEP 561 marker (contents: "partial"). Force it into the
# wheel so a hatch default change cannot drop the public typing signal.
[tool.hatch.build.targets.wheel.force-include]
"src/quant_fund/py.typed" = "quant_fund/py.typed"

# Default sdist = every VCS-tracked file (data/, notebooks, host symlinks —
# 37k files). The distributable source is the buildable package + tests.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "configs",
    "docs",
    "scripts",
    "pyproject.toml",
    "README.md",
    "SECURITY.md",
    ".env.example",
    "Makefile",
]

# Single source of truth: fx1.__version__ follows semver per
# docs/FX1_API_STABILITY.md — the distribution must not drift from it.
[tool.hatch.version]
path = "src/fx1/__init__.py"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "UP042", "SIM108", "SIM115"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

[tool.mypy]
python_version = "3.12"
strict = false
# Strictness ratchet. Do not loosen a module once it is listed, and do not
# silence a module with ignore_errors or a blanket disable_error_code.
#
# Tier strict — the public facade and the modules that implement it
# (config, ingest, backtest engine and metrics, research entry, receipt
# verify, and their direct imports). These pass mypy --strict.
# The override below spells out the --strict flags (a `strict = true`
# override is applied to the whole run by this mypy, so it is not used).
# CI and `make typecheck` also run
# `mypy --strict --follow-imports=silent` on the facade:
#   quant_fund            package root, lazy re-exports
#   quant_fund.public     load_config, ingest, run_backtest, run_research,
#                         read_research_receipt, verify_research
# `typings/cvxpy` is a narrow stub for atom factories that cvxpy re-exports
# with `import *` (invisible when implicit re-exports are off) and for
# `Problem.solve`, which is untyped upstream.
# Promote another module by adding its name to that override only after
# `mypy --strict --follow-imports=silent` is clean for that file, with no
# new ignore comments. Do not add quant_fund.* — other engines stay on
# the gradual tier.
#
# Tier checked — every other quant_fund module, via the global flags:
# check_untyped_defs and warn_return_any. disallow_untyped_defs stays off
# until a module is promoted. py.typed is marked partial for this reason.
#
# Ratcheted 2026-09-16: checks untyped bodies (verified 0 errors at 133 files).
# 2026-09-17: warn_return_any + warn_unused_ignores enforced per-module.
# 2026-09-25: warn_return_any is GLOBAL and clean — the 66-module debt list
# was fixed in one sweep (np.asarray/float/cast wraps, behavior-preserving).
# warn_unused_ignores remains enforced only on the originally-ratcheted
# modules below.
check_untyped_defs = true
warn_return_any = true
disallow_untyped_defs = false
packages = ["fx1", "quant_fund"]
ignore_missing_imports = true
warn_unused_ignores = false
mypy_path = "typings"

# Public library surface and the modules behind it. These are the per-module
# flags that make up `mypy --strict` (mypy applies a literal `strict = true`
# override to the whole run, so the flags are spelled out here). CI also runs
# `mypy --strict --follow-imports=silent` on the facade files.
[[tool.mypy.overrides]]
module = [
    "quant_fund",
    "quant_fund.public",
    "quant_fund.backtest.engine",
    "quant_fund.config.loader",
    "quant_fund.config.models",
    "quant_fund.data.adapters.hf_ohlcv_1m",
    "quant_fund.data.adapters.parquet",
    "quant_fund.data.adapters.synthetic",
    "quant_fund.data.corporate_actions",
    "quant_fund.data.ingest",
    "quant_fund.data.lake",
    "quant_fund.data.security_master",
    "quant_fund.data.sources",
    "quant_fund.data.sources.adapters",
    "quant_fund.data.sources.base",
    "quant_fund.data.sources.normalize",
    "quant_fund.data.sources.registry",
    "quant_fund.data.sources.storage",
    "quant_fund.data.universe",
    "quant_fund.execution.costs",
    "quant_fund.metrics.analytics",
    "quant_fund.metrics.inference",
    "quant_fund.metrics.returns",
    "quant_fund.metrics.risk",
    "quant_fund.models.crc",
    "quant_fund.monitoring.kill_switch",
    "quant_fund.northset.benches",
    "quant_fund.pipeline",
    "quant_fund.pipeline.dataset",
    "quant_fund.pipeline.forecast",
    "quant_fund.portfolio.optimizer",
    "quant_fund.portfolio.risk_gate",
    "quant_fund.reporting.report",
    "quant_fund.research.agent",
    "quant_fund.research.benches",
    "quant_fund.research.benches_extra",
    "quant_fund.research.catalog",
    "quant_fund.research.catalog._helpers",
    "quant_fund.research.catalog.candle",
    "quant_fund.research.catalog.consistency",
    "quant_fund.research.catalog.constants",
    "quant_fund.research.catalog.families",
    "quant_fund.research.catalog.kyle",
    "quant_fund.research.catalog.northset",
    "quant_fund.research.catalog.predicates",
    "quant_fund.research.catalog.session",
    "quant_fund.research.cost_allocation",
    "quant_fund.research.verify",
    "quant_fund.risk.overlay",
    "quant_fund.risk.pyrisk",
    "quant_fund.risk.pyriskmgmt",
    "quant_fund.schemas.errors",
    "quant_fund.schemas.forecast",
    "quant_fund.schemas.orders",
    "quant_fund.utils.hashing",
    "quant_fund.utils.reproducibility",
    "quant_fund.utils.seeds",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
# warn_redundant_casts is part of --strict but this mypy rejects it in a
# per-module section. The CI `mypy --strict --follow-imports=silent` run
# covers it for these two files.
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

# Public-source adapters intentionally expose explicit per-source fetch kwargs
# (series_id, cik, path, ...) instead of an untyped **kwargs signature, so the
# LSP override warning on SourceAdapter.fetch(**kwargs) is disabled here only.
[[tool.mypy.overrides]]
module = ["quant_fund.data.sources.adapters"]
disable_error_code = ["override"]

# Numeric-return ratchet COMPLETE 2026-09-25: warn_unused_ignores stays
# enforced on these originally-ratcheted modules; warn_return_any is now a
# clean global default (the 66-module debt list was fixed in one sweep).
[[tool.mypy.overrides]]
module = [
    "quant_fund.utils.numeric",
    "quant_fund.metrics.conformal",
    "quant_fund.metrics.evalues",
    "quant_fund.metrics.probability",
    "quant_fund.execution.almgren_chriss",
    "quant_fund.portfolio.interval_risk",
    "quant_fund.models.covariance",
    "quant_fund.models.regime",
    "quant_fund.models.calibration",
    "quant_fund.models.distribution",
    "quant_fund.models.tail",
]
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
# Canonical discovery: the fx-1 suite runs via `make fx1-test` (tests/fx1 is
# intentionally outside testpaths; the dead tests/tests mirror was removed).
testpaths = ["tests/unit", "tests/property", "tests/regression", "tests/end_to_end"]
addopts = "-q --strict-markers"
markers = [
    "network: tests that require internet (disabled by default)",
    "slow: longer integration tests",
    "synthetic: uses synthetic market data",
    "perf_full: larger synthetic performance benchmarks (not the CI fast subset)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["fx1", "quant_fund"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
# Single source of truth for the coverage gate (CI/Makefile pass no inline
# --cov-fail-under so the threshold cannot drift between the two).
# Ratcheted 2026-09-25: measured 84.93% local (macOS) and 81.51% on CI
# (Linux) — floor set at 80 with cross-platform headroom. Raise, never lower.
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"

# PROOFCORE per-package coverage floors (A3 #2, DESIGN.md §9.3/§12) — ADDITIVE
# to the global 80% floor above, which is unchanged. Enforced by
# `make proofcore-coverage` / the coverage-floors job in
# .github/workflows/proofcore.yml via `python -m quant_fund.proofcore.ci
# coverage-gate`, which reads this table (single source of truth).
# Ratchet-only thereafter: raise, never lower.
[tool.proofcore.coverage-floors]
pit = 90
proof = 90
leakage = 85
reality = 90
proofcore = 90
