site_name: dipcatcher
site_description: Research harness for fx-1. Data, evaluation, and receipt verification.
site_url: https://artificial-hedge.github.io/dipcatcher/
repo_url: https://github.com/artificial-hedge/dipcatcher
repo_name: artificial-hedge/dipcatcher
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: dipcatcher research documentation. Live trading is not implemented.

# Kept in the repo. Omitted from the published site because they headline
# Sharpe, holdout returns, or P&L. Listed from docs/archive.md.
exclude_docs: |
  MEGAPLAN_SHARPE5.md
  CARRY_VS_MEGAPLAN.md
  carry_expansion_2026_09.md
  carry_research_2026_09.md
  SIM_LIVE_PNL.md
  ULTRAPLAN_FRONTIER.md
  SOTA_GAP_ANALYSIS.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/book-open-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: list
            docstring_options:
              warnings: false
            merge_init_into_class: true
            show_root_heading: true
            show_root_full_path: true
            show_root_toc_entry: true
            show_signature_annotations: true
            signature_crossrefs: false
            separate_signature: true
            show_source: false
            show_if_no_docstring: true
            show_submodules: false
            members_order: source
            filters:
              - "!^_"
            heading_level: 2
            summary:
              attributes: true
              functions: true
              classes: true
              modules: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
      inline_syntax:
        - round
      block_syntax:
        - square
  - toc:
      permalink: true
  - tables
  - footnotes

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

